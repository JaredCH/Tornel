name: release

# Publishes installable packages for every OS the app targets.
#
# Triggered by a version tag (`v0.1.0`) or manually. A manual run builds the
# artifacts and uploads them as workflow artifacts without creating a release, so
# the pipeline can be exercised before a tag exists.
#
# The Windows and Linux jobs are independent: a Linux-only break must not block a
# Windows package, and vice versa. The `publish` job only runs when both succeed,
# so a release never contains a partial set of platforms.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      draft:
        description: "Create the GitHub release as a draft"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Windows: NSIS installer (.exe)
  # ---------------------------------------------------------------------------
  windows:
    name: windows (nsis)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      # SQLCipher is built with vendored OpenSSL, which needs Perl. The runner
      # usually ships Strawberry Perl; this makes a missing one an explicit,
      # early failure rather than a confusing openssl-sys error.
      - name: Verify build prerequisites
        shell: pwsh
        run: |
          $perl = Get-Command perl -ErrorAction SilentlyContinue
          if (-not $perl) {
            Write-Host "Perl is not installed; installing Strawberry Perl." -ForegroundColor Yellow
            choco install strawberryperl -y --no-progress
            $env:PATH = "C:\Strawberry\perl\bin;C:\Strawberry\c\bin;$env:PATH"
            "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
            "C:\Strawberry\c\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }
          perl --version

      # The shipped build must have the Tor backend: without it the app refuses to
      # send at all. Building the release without `--features tor` would produce an
      # installer that cannot do the one thing it exists for.
      - name: Build and bundle (NSIS)
        run: npx --yes @tauri-apps/cli@^2 build --features tor --bundles nsis --ci
        working-directory: crates/anon-app

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: anon-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux: .deb and .AppImage
  # ---------------------------------------------------------------------------
  linux:
    name: linux (deb + appimage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            perl \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            file

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build and bundle (deb + AppImage)
        run: npx --yes @tauri-apps/cli@^2 build --features tor --bundles deb,appimage --ci
        working-directory: crates/anon-app

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: anon-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Android: signed APK (and AAB for Play)
  # ---------------------------------------------------------------------------
  #
  # Android is built on Linux rather than Windows because the vendored OpenSSL that
  # SQLCipher compiles needs a Unix-like Perl. On Windows the build fails with
  # "This perl implementation doesn't produce Unix like paths", which is a toolchain
  # limitation rather than a code problem.
  android:
    name: android (apk)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev perl file

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.lock') }}

      # The Android project is generated, not committed (see .gitignore), so it must be
      # created before the build. `android init` is idempotent and fails if the project
      # already exists, which is why it is guarded.
      - name: Generate Android project
        run: |
          if [ ! -d gen/android ]; then
            npx --yes @tauri-apps/cli@^2 android init --ci
          fi
        working-directory: crates/anon-app

      # The generated Gradle project has no release signing config, so this produces an
      # *unsigned* release APK. That is deliberate rather than an oversight: signing needs
      # a keystore, and a keystore is a long-lived secret that must not be invented by CI.
      # To ship a signed build, add a `signingConfigs.release` block to
      # `gen/android/app/build.gradle.kts` (see the Tauri Android signing guide) and supply
      # the keystore through repository secrets. Until then the artifact is installable
      # only after `apksigner` signs it, which the README says.
      - name: Build APK
        run: npx --yes @tauri-apps/cli@^2 android build --apk --ci
        working-directory: crates/anon-app

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: anon-android
          path: |
            target/release/apk/*.apk
            crates/anon-app/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish: attach every platform's artifacts to one GitHub release
  # ---------------------------------------------------------------------------
  publish:
    name: publish release
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    # A manual run without a tag only produces artifacts, never a release.
    #
    # Windows and Linux must both succeed: a release that silently omits a platform
    # users already have installed is worse than no release. Android is deliberately
    # *not* required — it is the newest target and the one most likely to break on a
    # toolchain change (NDK, Gradle, the vendored OpenSSL build), and it must not be
    # able to block the desktop packages. A green Android build is still included,
    # because the artifact download below picks up whatever the run produced.
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      && needs.windows.result == 'success'
      && needs.linux.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # `upload-artifact` preserves the directory structure of the globs it was
      # given, so the merged tree contains `deb/` and `appimage/` subdirectories.
      # Flatten it first: the release should present a flat list of packages, and
      # `sha256sum *` would otherwise fail on the directories.
      - name: Flatten artifacts
        run: |
          mkdir -p out
          find dist -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.apk' \) \
            -exec cp {} out/ \;
          ls -la out

      # Checksums let a user verify a download without trusting the transport.
      # The app's whole premise is that the network is hostile, so shipping an
      # unverifiable binary would be inconsistent with that.
      - name: Generate checksums
        run: |
          cd out
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          generate_release_notes: true
          files: |
            out/*.exe
            out/*.deb
            out/*.AppImage
            out/*.apk
            out/SHA256SUMS.txt
          body: |
            Tornel `anon` ${{ github.ref_name }}

            Serverless, 100% Tor v3 onion peer-to-peer messenger.

            ## Packages

            | Platform | File |
            | --- | --- |
            | Windows (x64) | `anon_*_x64-setup.exe` (NSIS) |
            | Debian / Ubuntu (x64) | `anon_*_amd64.deb` |
            | Any Linux (x64) | `anon_*_amd64.AppImage` |
            | Android (arm64 + x86_64) | `anon_*_universal.apk` |

            Verify a download against `SHA256SUMS.txt` before running it.

            ## What this build does and does not do

            These packages are built with `--features tor`, so the embedded Arti
            transport is present and the app can reach the Tor network. A build
            without that feature refuses to send at all — that is the fail-closed
            default, not a bug.

            The app still cannot send until Tor bootstraps and its own v3 onion
            service publishes (typically 20–60s after launch). Messages composed
            before then are queued on your device and retried automatically.

            ## Linux notes

            The `.deb` declares `libwebkit2gtk-4.1-0` and `libgtk-3-0`. The
            AppImage needs FUSE 2 (`libfuse2`) to run; on distributions that ship
            only FUSE 3, run it with `--appimage-extract-and-run`.
