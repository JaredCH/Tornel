name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: build, test, lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # SQLCipher is built with the vendored-OpenSSL feature, so OpenSSL is
      # compiled from source and needs Perl (see README). GitHub's Windows
      # runners ship Strawberry Perl, so this is usually already satisfied;
      # the check makes a missing Perl an explicit, early failure rather than
      # a confusing openssl-sys error.
      - name: Verify build prerequisites
        shell: pwsh
        run: |
          $perl = Get-Command perl -ErrorAction SilentlyContinue
          if (-not $perl) {
            Write-Host "Perl is not installed; installing Strawberry Perl." -ForegroundColor Yellow
            choco install strawberryperl -y --no-progress
          }
          perl --version

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The Arti backend is behind a feature flag, so the default clippy/test run
      # never compiles it. Without this step a break in the Tor transport would
      # only surface when someone built with `--features arti`.
      - name: Clippy (Arti feature)
        run: cargo clippy -p anon-transport --features arti --all-targets -- -D warnings

      # The Tauri shell needs WebView2 headers at build time. GitHub's
      # windows-latest image ships them; splitting the step out makes a shell-only
      # break obvious rather than buried inside a workspace build.
      - name: Build (Tauri shell)
        run: cargo build -p anon-app

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Test (Arti feature)
        run: cargo test -p anon-transport --features arti

      # plan.md §7.1/§10: the no-clearnet invariant must be checked in CI,
      # not only by a test a developer might skip locally.
      - name: No-clearnet guard
        shell: pwsh
        run: ./scripts/check-no-clearnet.ps1

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # `.cargo/audit.toml` carries the ignore list. Every entry there is a
      # transitive dependency with no available fix, and each one is justified in
      # the file. The gate still fails on any *new* advisory, which is the point:
      # an ignore list that is never re-examined is worse than no gate at all.
      - name: Security audit
        run: cargo audit

  # Linux build. The app is developed on Windows, so without this job a
  # platform-specific break (a Windows-only path, a missing system library, a
  # Tauri bundle target that only exists on one OS) would ship unnoticed.
  #
  # The system packages are the ones Tauri v2 needs on Debian/Ubuntu: WebKitGTK
  # 4.1 for the webview, GTK 3 for the window, and the AppImage tooling for the
  # portable bundle. `libssl-dev` and `perl` are for the vendored OpenSSL that
  # SQLCipher compiles.
  linux:
    name: build and test (linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            perl \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            file

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      # The no-clearnet invariant is platform-independent, but running it here too
      # means a Linux-only contributor gets the same gate as CI on Windows.
      - name: No-clearnet guard
        shell: pwsh
        run: ./scripts/check-no-clearnet.ps1

      # Produce the actual installable artifacts (.deb and .AppImage) so a broken
      # bundle config fails here rather than at release time.
      #
      # `tauri build` (not `tauri bundle`) is what compiles the app and then
      # packages it; `bundle` alone expects an already-built binary and would
      # silently package a stale one. It must run from the crate directory so the
      # CLI finds `tauri.conf.json`.
      - name: Bundle (deb + AppImage)
        run: npx --yes @tauri-apps/cli@^2 build --bundles deb,appimage --ci
        working-directory: crates/anon-app

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: anon-linux-bundles
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # Android build. The app targets Android as well as desktop, and the Android path has
  # its own failure modes that no desktop job can catch: `keyring`'s `v1` facade has no
  # Android store at all, the credential store needs the NDK application context, and the
  # vendored OpenSSL that SQLCipher compiles needs a Unix-like Perl (which is why this runs
  # on Linux rather than Windows).
  #
  # Only `cargo check` runs here. A full APK build needs the Android SDK, an emulator or
  # device, and a signing key; the release workflow does that. What this job guarantees is
  # that the Android-only code paths still compile.
  android:
    name: build (android)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev perl file

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.lock') }}

      # `cargo ndk` sets the linker and the CC/AR variables the vendored OpenSSL build
      # needs, which a bare `cargo check --target` does not.
      - name: Check (Android)
        run: cargo ndk -t arm64-v8a check -p anon-app

  # The `check` job above uses `@stable`, so the declared `rust-version` is never
  # actually built. That is how the workspace came to declare 1.85 while its own
  # dependency tree required 1.92: nothing ever compiled the declared minimum, so the
  # declaration could drift without a single red build. This job pins the declared MSRV
  # so a dependency bump that raises the real minimum fails here instead of surprising a
  # user on an older toolchain.
  #
  # Keep the version below in lockstep with `rust-version` in the workspace Cargo.toml.
  msrv:
    name: build at declared MSRV
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.92 (the declared MSRV)
        uses: dtolnay/rust-toolchain@1.92.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}

      - name: Verify build prerequisites
        shell: pwsh
        run: |
          $perl = Get-Command perl -ErrorAction SilentlyContinue
          if (-not $perl) {
            Write-Host "Perl is not installed; installing Strawberry Perl." -ForegroundColor Yellow
            choco install strawberryperl -y --no-progress
          }
          perl --version

      # A build is enough: if the declared MSRV cannot compile the workspace, the
      # declaration is wrong. Running the full suite here would double CI time for no
      # extra signal about the MSRV itself.
      - name: Build at MSRV
        run: cargo build --workspace

      # The Arti backend is the dependency that actually sets the MSRV (safelog 1.92),
      # so it must be compiled here or this job would not catch the case it exists for.
      - name: Build at MSRV (Arti feature)
        run: cargo build -p anon-transport --features arti
