[package]
name = "anon-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anon-core.workspace = true
anon-storage.workspace = true
anon-transport.workspace = true
anon-mls.workspace = true
anon-messaging.workspace = true
anon-consent.workspace = true
anon-ipc.workspace = true
thiserror.workspace = true
getrandom.workspace = true
hex.workspace = true
hkdf.workspace = true
sha2.workspace = true
time.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[features]
default = []
# The Tor edition of the demo needs the Arti backend.
tor = ["anon-transport/arti"]

[[bin]]
name = "anon-demo"
path = "src/main.rs"
