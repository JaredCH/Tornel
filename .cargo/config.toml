# Build-footprint tuning.
#
# Dependency debuginfo was ~13.5 GB of the debug target directory: every
# third-party crate (Arti, OpenSSL, SQLCipher, ICU, ...) emitted a full .pdb that
# is never stepped through. Disabling it for dependencies only keeps the
# workspace's own crates fully debuggable, so breakpoints in `crates/` still work.
#
# Note this is `package."*"`, not `[profile.dev] debug = false`: the latter would
# strip debuginfo from our own code too.
[profile.dev.package."*"]
debug = false

# Proc macros and build scripts are compiled for the host, so they are governed
# by `build-override` rather than `package."*"`. Without this they still emit
# ~2.6 MB of .pdb each (serde_derive, zeroize_derive, thiserror_impl, ...).
[profile.dev.build-override]
debug = false

# 16 KB page-size compatibility (Android 15+).
#
# NDK r27 links 64-bit Android targets with 16 KB ELF segment alignment by
# default, but 32-bit targets (armeabi-v7a, x86) still default to 4 KB. Devices
# running 16 KB page-size kernels refuse to install APKs whose native libraries
# are not 16 KB-aligned, reporting "package appears to be invalid" — the failure
# seen with v0.1.7. Setting max-page-size explicitly on every Android target
# makes all four ABIs 16 KB-compatible regardless of NDK defaults.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.armv7-linux-androideabi]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.i686-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
